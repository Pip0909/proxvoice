plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nirth.proxvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nirth.proxvoice'
        minSdk 24
        targetSdk 34
        // Semver-style tags: v0.x.y — versionCode must only go up for installs
        versionCode 6
        versionName '0.3.3'
    }

    // Fixed keystore so CI builds can update over previous installs
    signingConfigs {
        release {
            storeFile file('keystore/proxvoice-debug.jks')
            storePassword 'proxvoice'
            keyAlias 'proxvoice'
            keyPassword 'proxvoice'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
