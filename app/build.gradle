plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nirth.proxvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nirth.proxvoice'
        minSdk 24
        targetSdk 34
        // Semver-style tags: v0.x.y — versionCode must only go up for installs
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
