name: Build APK

on:
  push:
    paths-ignore:
      - 'server/**'
      - 'render.yaml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ProximityVoice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProximityVoice-apk
          path: ProximityVoice.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ProximityVoice.apk --title "Proximity Voice APK" --notes "Debug APK (latest build)" --target "${{ github.sha }}"
